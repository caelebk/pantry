<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pantry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pantry — Smart kitchen inventory management. Track your food, reduce waste, and plan meals effortlessly." />
    <link rel="icon" type="image/svg+xml" href="favico.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=skillet"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      " />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=skillet" />
    </noscript>
  </head>

  <body>
    <script>
      // Apply the stored theme (or the OS colour scheme) before Angular boots to avoid a
      // flash of the wrong theme. ThemeService reads the same key and reconciles on init.
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var stored = localStorage.getItem('pantry.theme');
          if (stored === 'dark' || stored === 'light') dark = stored === 'dark';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <pantry-root></pantry-root>
  </body>
</html>
