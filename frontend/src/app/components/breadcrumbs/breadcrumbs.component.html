@if (breadcrumbs().length > 0) {
  <nav class="flex items-center gap-1.5 text-xs font-semibold mb-4 text-surface-500 dark:text-surface-400 overflow-x-auto py-1">
    @for (item of breadcrumbs(); track item.label; let last = $last) {
      @if (!last && item.url) {
        <a
          [routerLink]="item.url"
          [queryParams]="item.queryParams"
          class="inline-flex items-center gap-1.5 text-surface-600 hover:text-primary-600 dark:text-surface-400 dark:hover:text-primary-400 transition-colors py-1 px-2 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800/60">
          @if (item.icon) {
            <i [class]="item.icon + ' text-[12px]'"></i>
          }
          <span>{{ item.label }}</span>
        </a>
        <i class="pi pi-chevron-right text-[10px] text-surface-300 dark:text-surface-600 shrink-0"></i>
      } @else {
        <span class="inline-flex items-center gap-1.5 text-surface-900 dark:text-white font-bold py-1 px-2.5 rounded-lg bg-surface-200/60 dark:bg-surface-800/80 border border-surface-200 dark:border-surface-700/60 shadow-2xs">
          @if (item.icon) {
            <i [class]="item.icon + ' text-[12px] text-primary-500'"></i>
          }
          <span>{{ item.label }}</span>
        </span>
      }
    }
  </nav>
}
