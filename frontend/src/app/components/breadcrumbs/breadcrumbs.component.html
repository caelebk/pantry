@if (breadcrumbs().length > 1) {
  <nav
    [attr.aria-label]="'a11y.breadcrumb' | transloco"
    class="type-meta mb-4 text-surface-600 dark:text-surface-400">
    <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 min-w-0">
      @for (item of breadcrumbs(); track $index; let last = $last; let index = $index) {
        <li
          class="sm:flex items-center gap-2 min-w-0 max-w-full"
          [class.hidden]="breadcrumbs().length > 2 && index < breadcrumbs().length - 2"
          [class.flex]="breadcrumbs().length <= 2 || index >= breadcrumbs().length - 2">
          @if (!last && item.url) {
            <a
              [routerLink]="item.url"
              [queryParams]="item.queryParams"
              class="inline-flex items-center min-h-[42px] break-words hover:text-primary-700 dark:hover:text-primary-400 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
              {{ item.label | transloco }}
            </a>
          } @else {
            <span
              [attr.aria-current]="last ? 'page' : null"
              class="inline-flex items-center min-h-[42px] break-words type-label text-surface-700 dark:text-surface-200">
              {{ item.label | transloco }}
            </span>
          }
          @if (!last) {
            <i
              class="pi pi-chevron-right type-meta shrink-0 text-surface-500 dark:text-surface-400"
              aria-hidden="true"></i>
          }
        </li>
      }
    </ol>
  </nav>
}
