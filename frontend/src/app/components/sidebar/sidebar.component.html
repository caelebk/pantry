<!-- Mobile Top Header Bar -->
<div class="md:hidden sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-surface-900/80 border-b border-surface-200/60 dark:border-surface-800/80 px-4 h-16 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div
      class="w-9 h-9 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md shadow-primary-500/20">
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=skillet" />
      <span class="material-symbols-outlined text-[20px]">skillet</span>
    </div>
    <h1 class="text-lg font-bold tracking-tight text-surface-900 dark:text-white">
      {{ 'app.name' | transloco }}
    </h1>
  </div>
  <div class="flex items-center gap-2">
    <button
      (click)="onToggleTheme()"
      class="p-2 cursor-pointer rounded-xl hover:bg-surface-200/60 dark:hover:bg-surface-800/60 text-surface-500 dark:text-surface-400">
      @if (darkMode) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      }
    </button>
    <button
      (click)="toggleMobileMenu()"
      class="p-2 cursor-pointer rounded-xl hover:bg-surface-200/60 dark:hover:bg-surface-800/60 text-surface-600 dark:text-surface-300">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </div>
</div>

<!-- Mobile Backdrop Overlay -->
@if (mobileMenuOpen) {
  <div
    (click)="toggleMobileMenu()"
    class="md:hidden fixed inset-0 z-40 bg-black/50 backdrop-blur-xs transition-opacity">
  </div>
}

<!-- Sidebar Drawer / Desktop Sidebar -->
<aside
  [class.translate-x-0]="mobileMenuOpen"
  [class.-translate-x-full]="!mobileMenuOpen"
  [class.md:w-20]="isCollapsed"
  [class.md:w-64]="!isCollapsed"
  class="fixed md:sticky top-0 left-0 z-50 h-screen w-64 md:translate-x-0 transition-all duration-300 ease-in-out flex flex-col backdrop-blur-xl bg-white/80 dark:bg-surface-900/90 border-r border-surface-200/60 dark:border-surface-800/80 shadow-xl md:shadow-none shrink-0 relative group">

  <!-- Desktop Floating Edge Toggle Button (Mounted on Right Border) -->
  <button
    (click)="toggleCollapse()"
    [attr.title]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'"
    class="hidden md:flex absolute -right-3.5 top-6 z-50 w-7 h-7 rounded-full bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-md items-center justify-center text-surface-600 dark:text-surface-300 hover:text-primary-600 dark:hover:text-primary-400 hover:scale-110 active:scale-95 transition-all cursor-pointer">
    @if (isCollapsed) {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    }
  </button>

  <!-- Sidebar Header / Logo -->
  <div
    [class.justify-center]="isCollapsed"
    class="p-4 md:p-5 flex items-center border-b border-surface-200/40 dark:border-surface-800/40 h-18">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-primary-500/25 transition-all duration-200 hover:scale-105 shrink-0">
        <span class="material-symbols-outlined text-[22px]">skillet</span>
      </div>
      @if (!isCollapsed) {
        <div class="hidden md:block overflow-hidden transition-all duration-300">
          <h1 class="text-lg font-bold tracking-tight text-surface-900 dark:text-white leading-tight whitespace-nowrap">
            {{ 'app.name' | transloco }}
          </h1>
          <span class="text-[11px] font-medium text-surface-500 dark:text-surface-400 whitespace-nowrap">Inventory & Recipes</span>
        </div>
      }
    </div>
  </div>

  <!-- Sidebar Navigation Menu -->
  <nav class="flex-1 px-3 py-6 space-y-1.5 overflow-y-auto">
    @if (!isCollapsed) {
      <div class="px-3 pb-2 text-[11px] font-bold text-surface-400 dark:text-surface-500 uppercase tracking-wider hidden md:block">
        Main Navigation
      </div>
    }

    <!-- Dashboard Link -->
    <button
      (click)="selectTab(tabs.Dashboard)"
      [attr.title]="'nav.dashboard' | transloco"
      [class.justify-center]="isCollapsed"
      [class.px-2.5]="isCollapsed"
      [class.px-3.5]="!isCollapsed"
      [class.bg-primary-500/10]="isDashboardActive()"
      [class.dark:bg-primary-500/15]="isDashboardActive()"
      [class.text-primary-600]="isDashboardActive()"
      [class.dark:text-primary-400]="isDashboardActive()"
      [class.font-semibold]="isDashboardActive()"
      [class.text-surface-600]="!isDashboardActive()"
      [class.dark:text-surface-400]="!isDashboardActive()"
      [class.hover:bg-surface-100]="!isDashboardActive()"
      [class.dark:hover:bg-surface-800/60]="!isDashboardActive()"
      [class.hover:text-surface-900]="!isDashboardActive()"
      [class.dark:hover:text-surface-100]="!isDashboardActive()"
      class="w-full flex items-center gap-3 py-2.5 rounded-xl transition-all duration-200 cursor-pointer text-sm group/item relative">
      @if (isDashboardActive()) {
        <div class="absolute left-0 top-2 bottom-2 w-1 bg-primary-500 rounded-r-full"></div>
      }
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
      </svg>
      @if (!isCollapsed) {
        <span class="whitespace-nowrap hidden md:inline">{{ 'nav.dashboard' | transloco }}</span>
      }
      <span class="whitespace-nowrap md:hidden">{{ 'nav.dashboard' | transloco }}</span>
    </button>

    <!-- Inventory Link -->
    <button
      (click)="selectTab(tabs.Inventory)"
      [attr.title]="'nav.inventory' | transloco"
      [class.justify-center]="isCollapsed"
      [class.px-2.5]="isCollapsed"
      [class.px-3.5]="!isCollapsed"
      [class.bg-primary-500/10]="isInventoryActive()"
      [class.dark:bg-primary-500/15]="isInventoryActive()"
      [class.text-primary-600]="isInventoryActive()"
      [class.dark:text-primary-400]="isInventoryActive()"
      [class.font-semibold]="isInventoryActive()"
      [class.text-surface-600]="!isInventoryActive()"
      [class.dark:text-surface-400]="!isInventoryActive()"
      [class.hover:bg-surface-100]="!isInventoryActive()"
      [class.dark:hover:bg-surface-800/60]="!isInventoryActive()"
      [class.hover:text-surface-900]="!isInventoryActive()"
      [class.dark:hover:text-surface-100]="!isInventoryActive()"
      class="w-full flex items-center gap-3 py-2.5 rounded-xl transition-all duration-200 cursor-pointer text-sm group/item relative">
      @if (isInventoryActive()) {
        <div class="absolute left-0 top-2 bottom-2 w-1 bg-primary-500 rounded-r-full"></div>
      }
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
      </svg>
      @if (!isCollapsed) {
        <span class="whitespace-nowrap hidden md:inline">{{ 'nav.inventory' | transloco }}</span>
      }
      <span class="whitespace-nowrap md:hidden">{{ 'nav.inventory' | transloco }}</span>
    </button>

    <!-- Recipes Link -->
    <button
      (click)="selectTab(tabs.Recipes)"
      [attr.title]="'nav.recipes' | transloco"
      [class.justify-center]="isCollapsed"
      [class.px-2.5]="isCollapsed"
      [class.px-3.5]="!isCollapsed"
      [class.bg-primary-500/10]="isRecipesActive()"
      [class.dark:bg-primary-500/15]="isRecipesActive()"
      [class.text-primary-600]="isRecipesActive()"
      [class.dark:text-primary-400]="isRecipesActive()"
      [class.font-semibold]="isRecipesActive()"
      [class.text-surface-600]="!isRecipesActive()"
      [class.dark:text-surface-400]="!isRecipesActive()"
      [class.hover:bg-surface-100]="!isRecipesActive()"
      [class.dark:hover:bg-surface-800/60]="!isRecipesActive()"
      [class.hover:text-surface-900]="!isRecipesActive()"
      [class.dark:hover:text-surface-100]="!isRecipesActive()"
      class="w-full flex items-center gap-3 py-2.5 rounded-xl transition-all duration-200 cursor-pointer text-sm group/item relative">
      @if (isRecipesActive()) {
        <div class="absolute left-0 top-2 bottom-2 w-1 bg-primary-500 rounded-r-full"></div>
      }
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
      </svg>
      @if (!isCollapsed) {
        <span class="whitespace-nowrap hidden md:inline">{{ 'nav.recipes' | transloco }}</span>
      }
      <span class="whitespace-nowrap md:hidden">{{ 'nav.recipes' | transloco }}</span>
    </button>
  </nav>

  <!-- Sidebar Footer Options -->
  <div class="p-3.5 border-t border-surface-200/40 dark:border-surface-800/40 space-y-1.5">
    <!-- Dark Mode Toggle Button -->
    <button
      (click)="onToggleTheme()"
      [attr.title]="darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      [class.justify-center]="isCollapsed"
      [class.px-2]="isCollapsed"
      [class.px-3.5]="!isCollapsed"
      class="w-full flex items-center justify-between py-2.5 rounded-xl hover:bg-surface-100 dark:hover:bg-surface-800/60 text-surface-600 dark:text-surface-400 transition-all duration-200 text-sm cursor-pointer">
      <div class="flex items-center gap-3">
        @if (darkMode) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-amber-400 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          @if (!isCollapsed) {
            <span class="font-medium text-surface-200 whitespace-nowrap hidden md:inline">Light Mode</span>
          }
          <span class="font-medium text-surface-200 whitespace-nowrap md:hidden">Light Mode</span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-500 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
          @if (!isCollapsed) {
            <span class="font-medium text-surface-700 whitespace-nowrap hidden md:inline">Dark Mode</span>
          }
          <span class="font-medium text-surface-700 whitespace-nowrap md:hidden">Dark Mode</span>
        }
      </div>
      @if (!isCollapsed) {
        <span class="text-xs px-2 py-0.5 rounded-md bg-surface-200/60 dark:bg-surface-800 text-surface-500 dark:text-surface-400 font-mono hidden md:inline">
          {{ darkMode ? 'DARK' : 'LIGHT' }}
        </span>
      }
      <span class="text-xs px-2 py-0.5 rounded-md bg-surface-200/60 dark:bg-surface-800 text-surface-500 dark:text-surface-400 font-mono md:hidden">
        {{ darkMode ? 'DARK' : 'LIGHT' }}
      </span>
    </button>
  </div>
</aside>
