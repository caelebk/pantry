<div class="flex items-center gap-1 bg-surface-100/60 dark:bg-surface-800/40 rounded-xl p-1">
  <button
    (click)="selectTab(tabs.Dashboard)"
    [class.bg-white]="isDashboardActive()"
    [class.dark:bg-surface-700]="isDashboardActive()"
    [class.shadow-sm]="isDashboardActive()"
    [class.text-primary-600]="isDashboardActive()"
    [class.dark:text-primary-400]="isDashboardActive()"
    [class.font-semibold]="isDashboardActive()"
    [class.text-surface-500]="!isDashboardActive()"
    [class.dark:text-surface-400]="!isDashboardActive()"
    [class.hover:text-surface-700]="!isDashboardActive()"
    [class.dark:hover:text-surface-300]="!isDashboardActive()"
    [class.hover:bg-white/50]="!isDashboardActive()"
    [class.dark:hover:bg-surface-700/50]="!isDashboardActive()"
    class="px-4 py-1.5 cursor-pointer text-sm font-medium rounded-lg transition-all duration-200">
    {{ 'nav.dashboard' | transloco }}
  </button>
  <button
    (click)="selectTab(tabs.Inventory)"
    [class.bg-white]="isInventoryActive()"
    [class.dark:bg-surface-700]="isInventoryActive()"
    [class.shadow-sm]="isInventoryActive()"
    [class.text-primary-600]="isInventoryActive()"
    [class.dark:text-primary-400]="isInventoryActive()"
    [class.font-semibold]="isInventoryActive()"
    [class.text-surface-500]="!isInventoryActive()"
    [class.dark:text-surface-400]="!isInventoryActive()"
    [class.hover:text-surface-700]="!isInventoryActive()"
    [class.dark:hover:text-surface-300]="!isInventoryActive()"
    [class.hover:bg-white/50]="!isInventoryActive()"
    [class.dark:hover:bg-surface-700/50]="!isInventoryActive()"
    class="px-4 py-1.5 cursor-pointer text-sm font-medium rounded-lg transition-all duration-200">
    {{ 'nav.inventory' | transloco }}
  </button>
  <button
    (click)="selectTab(tabs.Recipes)"
    [class.bg-white]="isRecipesActive()"
    [class.dark:bg-surface-700]="isRecipesActive()"
    [class.shadow-sm]="isRecipesActive()"
    [class.text-primary-600]="isRecipesActive()"
    [class.dark:text-primary-400]="isRecipesActive()"
    [class.font-semibold]="isRecipesActive()"
    [class.text-surface-500]="!isRecipesActive()"
    [class.dark:text-surface-400]="!isRecipesActive()"
    [class.hover:text-surface-700]="!isRecipesActive()"
    [class.dark:hover:text-surface-300]="!isRecipesActive()"
    [class.hover:bg-white/50]="!isRecipesActive()"
    [class.dark:hover:bg-surface-700/50]="!isRecipesActive()"
    class="px-4 py-1.5 cursor-pointer text-sm font-medium rounded-lg transition-all duration-200">
    {{ 'nav.recipes' | transloco }}
  </button>
</div>
