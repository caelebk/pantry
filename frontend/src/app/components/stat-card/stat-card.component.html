<div class="glass-card rounded-xl p-3.5 sm:p-4 transition-all duration-300 hover:shadow-md">
  <h3
    class="text-[11px] font-bold text-surface-500 dark:text-surface-400 tracking-wider uppercase mb-1.5">
    {{ title() }}
  </h3>
  <div class="flex items-baseline justify-between gap-2">
    <div class="text-2xl font-extrabold tracking-tight text-surface-900 dark:text-white">
      {{ value() }}
    </div>
    @if (trend()) {
      <span [class]="trendClass()">{{ trend() }}</span>
    }
  </div>
  @if (subtitle()) {
    <p class="text-[11px] text-surface-500 dark:text-surface-400 mt-1 font-medium">
      {{ subtitle() }}
    </p>
  }
</div>
