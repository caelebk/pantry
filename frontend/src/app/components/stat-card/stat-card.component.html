<div
  class="glass-card card-shine rounded-2xl p-6 transition-all duration-300 hover:shadow-lg hover:shadow-primary-500/5 dark:hover:shadow-primary-500/5 group">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-medium text-surface-500 dark:text-surface-400 tracking-wide uppercase">
      {{ title() }}
    </h3>
    <div class="w-8 h-8 rounded-xl bg-primary-500/10 dark:bg-primary-500/10 flex items-center justify-center transition-all duration-300 group-hover:bg-primary-500/15 group-hover:scale-110">
      <div class="w-2 h-2 rounded-full bg-primary-500"></div>
    </div>
  </div>
  <div class="text-4xl font-extrabold tracking-tight" [ngClass]="valueColor()">
    {{ displayValue() }}
  </div>
  @if (subtitle()) {
    <p class="text-xs text-surface-400 dark:text-surface-500 mt-3 font-medium">{{ subtitle() }}</p>
  }
</div>
