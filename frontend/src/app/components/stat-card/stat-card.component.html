<div class="glass-card rounded-xl p-3.5 sm:p-4 transition-all duration-300 hover:shadow-md">
  <h3 class="type-label text-surface-500 dark:text-surface-400 mb-1.5">
    {{ title() }}
  </h3>
  <div class="flex items-baseline justify-between gap-2">
    <div class="type-value text-surface-900 dark:text-white">
      {{ value() }}
    </div>
    @if (trend()) {
      <span [class]="trendClass()">{{ trend() }}</span>
    }
  </div>
  @if (subtitle()) {
    <p class="type-meta text-surface-500 dark:text-surface-400 mt-1">
      {{ subtitle() }}
    </p>
  }
</div>
