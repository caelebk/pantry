<div class="max-w-3xl mx-auto space-y-6 pb-12">
  <!-- Back Button & Header -->
  <div class="space-y-2">
    <button
      (click)="goBack()"
      class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h16.5" />
      </svg>
      Back to Shopping List
    </button>

    <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Add Shopping Item</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">Add a new grocery item with category, store location, and estimated price</p>
  </div>

  <!-- Main Form Card -->
  <form (ngSubmit)="saveItem()" class="bg-white dark:bg-[#1a1a1a] border border-gray-200/80 dark:border-gray-800 rounded-2xl p-6 shadow-xs space-y-5">
    
    <!-- Item Name Field -->
    <div class="space-y-1.5">
      <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Item Name <span class="text-rose-500">*</span></label>
      <input
        pInputText
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        placeholder="e.g., Organic Avocados, Extra Virgin Olive Oil..."
        class="w-full text-sm font-medium"
        required
        autofocus />
    </div>

    <!-- Category & Store Name Row -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Category</label>
        <p-select
          [options]="categories"
          [ngModel]="category()"
          (ngModelChange)="category.set($event)"
          name="category"
          styleClass="w-full text-xs font-medium"
          appendTo="body" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Store Name (Optional)</label>
        <input
          pInputText
          type="text"
          [ngModel]="storeName()"
          (ngModelChange)="storeName.set($event)"
          name="storeName"
          placeholder="e.g., Trader Joe's, Costco, Whole Foods..."
          class="w-full text-xs font-medium" />
      </div>
    </div>

    <!-- Quantity, Unit, Estimated Price Row -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
      <!-- Quantity Counter -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Quantity</label>
        <div class="flex items-center border border-gray-200 dark:border-gray-800 rounded-xl bg-gray-50 dark:bg-[#262626] overflow-hidden">
          <button
            type="button"
            (click)="decrementQuantity()"
            class="px-3 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-bold text-xs transition-colors cursor-pointer">
            -
          </button>
          <span class="flex-1 text-center font-extrabold text-xs text-gray-900 dark:text-white border-x border-gray-200 dark:border-gray-800 py-2">
            {{ quantity() }}
          </span>
          <button
            type="button"
            (click)="incrementQuantity()"
            class="px-3 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-bold text-xs transition-colors cursor-pointer">
            +
          </button>
        </div>
      </div>

      <!-- Unit Select -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Unit</label>
        <p-select
          [options]="units"
          [ngModel]="unit()"
          (ngModelChange)="unit.set($event)"
          name="unit"
          styleClass="w-full text-xs font-medium"
          appendTo="body" />
      </div>

      <!-- Est Price Input -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-700 dark:text-gray-300">Est. Price ($)</label>
        <p-inputNumber
          [ngModel]="estimatedPrice()"
          (ngModelChange)="estimatedPrice.set($event)"
          name="estimatedPrice"
          mode="currency"
          currency="USD"
          locale="en-US"
          placeholder="$0.00"
          styleClass="w-full"
          inputStyleClass="w-full text-xs font-medium" />
      </div>
    </div>

    <!-- Action Bar -->
    <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-200/80 dark:border-gray-800">
      <button
        type="button"
        (click)="goBack()"
        class="px-5 py-2.5 border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold rounded-xl hover:bg-gray-100 dark:hover:bg-[#262626] transition-colors cursor-pointer">
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="!name().trim()"
        class="px-6 py-2.5 bg-primary-600 hover:bg-primary-700 disabled:opacity-50 text-white text-xs font-semibold rounded-xl transition-all cursor-pointer shadow-xs">
        Save to Shopping List
      </button>
    </div>
  </form>
</div>
