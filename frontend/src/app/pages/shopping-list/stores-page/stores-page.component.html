<div class="page-layout page-layout--form">
  <header class="page-header">
    <div>
      <button type="button" (click)="goBack()" class="btn-ghost mb-2">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span>{{ 'nav.back' | transloco }}</span>
      </button>
      <h1 class="type-page-title text-surface-900 dark:text-white">
        {{ 'stores.title' | transloco }}
      </h1>
    </div>
  </header>

  <!-- Add New Store Card -->
  <pantry-card>
    <form (ngSubmit)="createStore()" class="flex items-end gap-2.5">
      <pantry-form-field
        class="flex-1 min-w-0"
        [label]="'stores.addStore' | transloco"
        forId="new-store-name">
        <input
          id="new-store-name"
          pInputText
          type="text"
          [ngModel]="newStoreName()"
          (ngModelChange)="newStoreName.set($event)"
          name="newStoreName"
          [placeholder]="'stores.storeNamePlaceholder' | transloco"
          class="w-full" />
      </pantry-form-field>
      <button type="submit" [disabled]="!newStoreName().trim() || isCreating()" class="btn-primary">
        <i class="pi pi-plus text-xs" aria-hidden="true"></i>
        <span>{{ 'stores.addStoreBtn' | transloco }}</span>
      </button>
    </form>
  </pantry-card>

  <!-- Existing Stores List Card -->
  <pantry-card>
    <div class="flex items-center justify-between mb-3.5">
      <h2 class="type-section-title text-surface-900 dark:text-white flex items-center gap-2">
        <i class="pi pi-map-marker text-surface-500 dark:text-surface-400" aria-hidden="true"></i>
        <span>{{ 'stores.yourStores' | transloco }}</span>
      </h2>
      <pantry-badge variant="neutral" size="sm">
        {{ stores().length }} {{ stores().length === 1 ? 'store' : 'stores' }}
      </pantry-badge>
    </div>

    <div class="flex flex-col gap-2.5">
      @for (store of stores(); track store.id) {
        <pantry-card variant="sub" padding="none">
          <div class="flex items-center justify-between gap-3 px-4 py-3">
            @if (editingStoreId() === store.id) {
              <!-- Editing Row State -->
              <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-0">
                <input
                  data-edit-input
                  pInputText
                  type="text"
                  [ngModel]="draftNames()[store.id]"
                  (ngModelChange)="setDraftName(store.id, $event)"
                  (keydown.enter)="save(store)"
                  (keydown.escape)="cancelEditing()"
                  [attr.aria-label]="'stores.editName' | transloco: { name: store.name }"
                  class="basis-full sm:basis-0 sm:flex-1 min-w-0" />
                <button
                  type="button"
                  (click)="save(store)"
                  [disabled]="!draftNames()[store.id]?.trim()"
                  class="btn-primary shrink-0">
                  <i class="pi pi-check text-xs" aria-hidden="true"></i>
                  <span>{{ 'stores.save' | transloco }}</span>
                </button>
                <button type="button" (click)="cancelEditing()" class="btn-secondary shrink-0">
                  {{ 'stores.cancel' | transloco }}
                </button>
              </div>
            } @else {
              <!-- Static Row State -->
              <button
                type="button"
                [attr.data-rename-id]="store.id"
                (click)="startEditing(store)"
                class="flex items-center gap-3 flex-1 min-w-0 min-h-[42px] text-left cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
                <span
                  class="type-body font-semibold text-surface-900 dark:text-white truncate"
                  [class.line-through]="store.archived"
                  [class.opacity-50]="store.archived">
                  {{ store.name }}
                </span>
                @if (store.archived) {
                  <pantry-badge variant="neutral" size="sm" class="shrink-0">
                    {{ 'stores.archivedBadge' | transloco }}
                  </pantry-badge>
                }
                <i
                  class="pi pi-pencil text-xs text-surface-500 dark:text-surface-400"
                  aria-hidden="true"></i>
              </button>

              <!-- Right Action: Archive / Restore Icon -->
              <div class="flex items-center gap-1 shrink-0 ml-2">
                <button
                  type="button"
                  (click)="archive(store)"
                  [attr.aria-label]="
                    (store.archived ? 'stores.restoreStore' : 'stores.archiveStore')
                      | transloco: { name: store.name }
                  "
                  [title]="
                    (store.archived ? 'stores.restoreTitle' : 'stores.archiveTitle') | transloco
                  "
                  class="btn-icon">
                  <i
                    [class]="store.archived ? 'pi pi-replay' : 'pi pi-inbox'"
                    aria-hidden="true"></i>
                </button>
              </div>
            }
          </div>
        </pantry-card>
      } @empty {
        <pantry-empty-state
          variant="plain"
          icon="pi pi-map-marker"
          [title]="'stores.noStoresTitle' | transloco"
          [description]="'stores.noStoresDesc' | transloco" />
      }
    </div>
  </pantry-card>
</div>
