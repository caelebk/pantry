<div class="page-layout page-layout--form">
  <header class="page-header">
    <div>
      <button (click)="onCancel()" type="button" class="btn-ghost hover:!bg-transparent mb-2">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span>{{ 'nav.back' | transloco }}</span>
      </button>
      <h1 class="type-page-title text-surface-900 dark:text-white">
        {{ 'groupForm.editTitle' | transloco }}
      </h1>
    </div>
  </header>

  @if (isLoading()) {
    <pantry-skeleton variant="card" height="240px" />
  } @else if (loadFailed()) {
    <div role="alert">
      <pantry-empty-state
        icon="pi pi-exclamation-circle"
        [title]="'itemEditor.loadErrorTitle' | transloco"
        [description]="'itemEditor.loadErrorDescription' | transloco"
        [actionText]="'itemEditor.retry' | transloco"
        (actionClick)="retryLoad()"></pantry-empty-state>
    </div>
  } @else {
    @if (submitError()) {
      <pantry-alert variant="danger">{{ submitError() }}</pantry-alert>
    }

    <!-- Form Card -->
    <pantry-card padding="md">
      <form [formGroup]="groupForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Name Field -->
        <pantry-form-field
          [label]="'groupForm.name' | transloco"
          forId="edit-group-name"
          [required]="true"
          [error]="
            groupForm.get('name')?.invalid && groupForm.get('name')?.touched
              ? ('groupForm.nameError' | transloco)
              : ''
          ">
          <input
            pInputText
            type="text"
            id="edit-group-name"
            formControlName="name"
            [placeholder]="'groupForm.namePlaceholder' | transloco"
            class="w-full" />
        </pantry-form-field>

        <!-- Parent Ingredient Category Select -->
        <pantry-form-field
          #categoryField
          [label]="'groupForm.parentCategory' | transloco"
          forId="edit-parent-category">
          <p-select
            inputId="edit-parent-category"
            [ariaLabelledBy]="categoryField.labelId()"
            [options]="ingredientCategories()"
            formControlName="ingredientCategory"
            dataKey="id"
            optionLabel="name"
            [placeholder]="'groupForm.categoryPlaceholder' | transloco"
            [showClear]="true"
            class="w-full"
            appendTo="body">
          </p-select>
        </pantry-form-field>

        <!-- Action Buttons -->
        <div
          class="flex items-center justify-end gap-3 pt-4 border-t border-surface-200/40 dark:border-surface-800/40">
          <button type="button" (click)="onCancel()" class="btn-secondary">
            {{ 'groupForm.cancel' | transloco }}
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting()"
            [attr.aria-busy]="isSubmitting()"
            class="btn-primary">
            @if (isSubmitting()) {
              <pantry-spinner [announce]="false" size="sm" color="white" />
            }
            <span>{{ 'groupForm.saveChanges' | transloco }}</span>
          </button>
        </div>
      </form>
    </pantry-card>
  }
</div>
