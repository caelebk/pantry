<div class="p-4">
  <form [formGroup]="editItemForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label
        class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1"
        for="edit-name"
        >{{ 'addItemForm.itemName' | transloco }}<span class="text-rose-500">*</span></label
      >
      <input
        pInputText
        id="edit-name"
        formControlName="name"
        [placeholder]="'addItemForm.itemNamePlaceholder' | transloco"
        class="w-full !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white" />
    </div>

    <div>
      <label
        class="block text-xs font-semibold text-surface-700 dark:text-surface-300 mb-2 uppercase tracking-wider">
        {{ 'addItemForm.location' | transloco }}
        <span class="text-rose-500">*</span>
      </label>
      <div class="grid grid-cols-3 gap-2">
        @for (loc of locations; track loc.id) {
          <button
            type="button"
            (click)="selectLocation(loc)"
            [class.bg-primary-600]="editItemForm.controls.location.value?.id === loc.id"
            [class.text-white]="editItemForm.controls.location.value?.id === loc.id"
            [class.border-primary-600]="editItemForm.controls.location.value?.id === loc.id"
            [class.shadow-md]="editItemForm.controls.location.value?.id === loc.id"
            [class.bg-surface-100]="editItemForm.controls.location.value?.id !== loc.id"
            [class.dark:bg-surface-800]="editItemForm.controls.location.value?.id !== loc.id"
            [class.text-surface-700]="editItemForm.controls.location.value?.id !== loc.id"
            [class.dark:text-surface-300]="editItemForm.controls.location.value?.id !== loc.id"
            class="p-2.5 rounded-xl border border-surface-200 dark:border-surface-700 text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5 hover:scale-[1.02] active:scale-[0.98]">
            <span>
              @if (loc.name === 'Fridge') {
                ❄️
              } @else if (loc.name === 'Freezer') {
                🧊
              } @else {
                🥫
              }
            </span>
            <span>{{ loc.name }}</span>
          </button>
        }
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <div class="flex items-center justify-between h-6 mb-1.5">
          <label
            class="text-xs font-medium text-surface-500 dark:text-surface-400 uppercase tracking-wider"
            for="edit-quantity">
            {{ 'addItemForm.quantity' | transloco }}
            <span class="text-rose-500">*</span>
          </label>
        </div>
        <p-inputnumber
          inputId="edit-quantity"
          formControlName="quantity"
          class="w-full"
          styleClass="w-full !h-[42px]"
          inputStyleClass="w-full !h-[42px] !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white !rounded-xl"
          [min]="1"
          [showButtons]="true"></p-inputnumber>
      </div>
      <div>
        <div class="flex items-center justify-between h-6 mb-1.5">
          <span
            class="text-xs font-medium text-surface-500 dark:text-surface-400 uppercase tracking-wider">
            {{ 'addItemForm.unit' | transloco }}
          </span>
          <span
            class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-primary-500/10 text-primary-600 dark:text-primary-400 border border-primary-500/20">
            <i class="pi pi-lock text-[9px]"></i> Inherited
          </span>
        </div>
        @if (editItemForm.controls.unit.value) {
          <div
            class="w-full h-[42px] flex items-center justify-between px-3 rounded-xl bg-surface-50 dark:bg-surface-800/60 border border-surface-200 dark:border-surface-700 text-surface-900 dark:text-white shadow-inner cursor-not-allowed">
            <span class="font-semibold text-sm">
              {{ editItemForm.controls.unit.value.name }}
            </span>
            <span
              class="px-2 py-0.5 text-xs font-bold rounded-lg bg-surface-200 dark:bg-surface-700 text-surface-700 dark:text-surface-300 uppercase tracking-wider">
              {{ editItemForm.controls.unit.value.shortName }}
            </span>
          </div>
        } @else {
          <div
            class="w-full h-[42px] flex items-center gap-2 px-3 rounded-xl bg-surface-50 dark:bg-surface-800/40 border border-dashed border-surface-300 dark:border-surface-700 text-surface-400 dark:text-surface-500 text-xs italic cursor-not-allowed">
            <i class="pi pi-info-circle text-xs"></i>
            <span>Select ingredient first</span>
          </div>
        }
      </div>
    </div>

    <div>
      <label
        class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1"
        for="edit-purchaseDate">
        {{ 'addItemForm.purchaseDate' | transloco }}
        <span class="text-rose-500">*</span>
      </label>
      <p-datepicker
        inputId="edit-purchaseDate"
        formControlName="purchaseDate"
        class="w-full"
        inputStyleClass="w-full !h-[42px] !px-3.5 !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white !rounded-l-xl text-sm font-medium"
        [showIcon]="true"
        appendTo="body"></p-datepicker>
    </div>
    <div>
      <label
        class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1"
        for="edit-expirationDate">
        {{ 'addItemForm.expirationDate' | transloco }}
        <span class="text-rose-500">*</span>
      </label>
      <p-datepicker
        inputId="edit-expirationDate"
        formControlName="expirationDate"
        class="w-full"
        inputStyleClass="w-full !h-[42px] !px-3.5 !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white !rounded-l-xl text-sm font-medium"
        [showIcon]="true"
        [showButtonBar]="true"
        appendTo="body"></p-datepicker>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <label
          class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1"
          for="edit-openedDate">
          {{ 'addItemForm.openedDate' | transloco }}
        </label>
        <p-datepicker
          inputId="edit-openedDate"
          formControlName="openedDate"
          class="w-full"
          inputStyleClass="w-full !h-[42px] !px-3.5 !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white !rounded-l-xl text-sm font-medium"
          [showIcon]="true"
          [showButtonBar]="true"
          appendTo="body"></p-datepicker>
      </div>
      <div>
        <label
          class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1"
          for="edit-notes">
          {{ 'addItemForm.notes' | transloco }}
        </label>
        <textarea
          pTextarea
          id="edit-notes"
          formControlName="notes"
          rows="3"
          [placeholder]="'addItemForm.notesPlaceholder' | transloco"
          class="w-full !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white"></textarea>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="!editItemForm.valid"
      class="w-full bg-primary-600 text-white font-medium py-2.5 rounded-md hover:bg-primary-700 transition-colors shadow-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-primary-600">
      {{ 'addItemForm.updateButton' | transloco }}
    </button>
  </form>
</div>
