<div class="space-y-6">
  <!-- Search, Category Filter, & Accordion Controls Bar -->
  <div class="glass-card p-4 rounded-2xl border border-surface-200/80 dark:border-surface-800/80 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-4">
    <!-- Search Box -->
    <div class="relative flex-1 w-full min-w-[200px]">
      <i class="pi pi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-surface-400 text-sm"></i>
      <input
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearch($event)"
        placeholder="Filter ingredients by name..."
        class="w-full pl-10 pr-9 py-2.5 bg-white/80 dark:bg-surface-900/80 border border-surface-200/80 dark:border-surface-700/80 text-surface-900 dark:text-white rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all placeholder:text-surface-400" />
      @if (searchQuery()) {
        <button
          (click)="onSearch('')"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-surface-400 hover:text-surface-600 dark:hover:text-surface-200">
          <i class="pi pi-times text-xs"></i>
        </button>
      }
    </div>

    <!-- Right Controls: Category Select & Expand/Collapse Toggle -->
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <p-select
        [options]="categories()"
        [ngModel]="selectedCategory()"
        (ngModelChange)="onCategorySelect($event)"
        optionLabel="name"
        [showClear]="true"
        placeholder="All Categories"
        styleClass="w-full sm:w-44 !bg-white/80 dark:!bg-surface-900/80 !border-surface-200/80 dark:!border-surface-700/80 !text-surface-900 dark:!text-white !rounded-xl text-xs font-semibold shadow-xs">
      </p-select>

      <div class="flex items-center gap-1 bg-surface-100/80 dark:bg-surface-800/60 p-1 rounded-xl shrink-0">
        <button
          type="button"
          (click)="expandAll()"
          class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-surface-600 dark:text-surface-400 hover:text-primary-600 dark:hover:text-primary-400 hover:bg-white dark:hover:bg-surface-700 transition-all cursor-pointer flex items-center gap-1"
          title="Expand All Groups">
          <i class="pi pi-arrows-alt text-[10px]"></i>
          <span class="hidden md:inline">Expand All</span>
        </button>
        <button
          type="button"
          (click)="collapseAll()"
          class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-surface-600 dark:text-surface-400 hover:text-primary-600 dark:hover:text-primary-400 hover:bg-white dark:hover:bg-surface-700 transition-all cursor-pointer flex items-center gap-1"
          title="Collapse All Groups">
          <i class="pi pi-minus text-[10px]"></i>
          <span class="hidden md:inline">Collapse</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Ingredient Groups Accordions -->
  <div class="space-y-4">
    @if (categoryGroups().length === 0) {
      <div class="glass-card rounded-2xl p-12 text-center border border-surface-200/80 dark:border-surface-800/80">
        <div class="w-16 h-16 rounded-2xl bg-surface-100 dark:bg-surface-800 flex items-center justify-center mx-auto mb-4 text-surface-400 dark:text-surface-500 text-2xl">
          <i class="pi pi-folder-open"></i>
        </div>
        <h4 class="text-base font-bold text-surface-900 dark:text-white mb-1">No Ingredient Groups Found</h4>
        <p class="text-xs text-surface-500 dark:text-surface-400">
          No ingredient categories match your search or filter criteria.
        </p>
      </div>
    } @else {
      @for (group of categoryGroups(); track group.category.id) {
        <pantry-ingredient-group
          [group]="group"
          [isExpanded]="isCategoryExpanded(group.category.id)"
          [expandedIngredients]="expandedIngredients()"
          (toggle)="onToggleCategory($event)"
          (toggleIngredient)="onToggleIngredient($event)">
        </pantry-ingredient-group>
      }
    }
  </div>
</div>
