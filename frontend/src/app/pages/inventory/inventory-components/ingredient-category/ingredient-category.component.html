<div
  class="glass-card rounded-2xl border border-surface-200/80 dark:border-surface-800/80 overflow-hidden transition-all duration-300 shadow-sm hover:shadow-md hover:border-surface-300 dark:hover:border-surface-700 relative group">
  <!-- Color Accent Stripe -->
  <div
    class="absolute left-0 top-0 bottom-0 w-1.5 rounded-l-2xl transition-all duration-300 group-hover:w-2"
    [style.backgroundColor]="nutrientType.color || '#ea580c'"></div>

  <!-- Category Header Accordion Button -->
  <button
    type="button"
    (click)="onToggleNutrientGroup()"
    class="w-full p-4 md:p-5 pl-5 md:pl-6 flex items-center justify-between gap-4 text-left transition-colors cursor-pointer select-none">
    <div class="flex items-center gap-4 min-w-0">
      <!-- Icon & Theme Badge -->
      <div
        class="w-11 h-11 md:w-12 md:h-12 rounded-2xl flex items-center justify-center text-2xl shadow-xs shrink-0 border transition-transform group-hover:scale-105 duration-200"
        [style.backgroundColor]="(nutrientType.color || '#ea580c') + '1a'"
        [style.borderColor]="(nutrientType.color || '#ea580c') + '35'"
        [style.boxShadow]="'0 4px 14px ' + (nutrientType.color || '#ea580c') + '1f'">
        <span>{{ nutrientType.icon || '📦' }}</span>
      </div>

      <!-- Title & Meta -->
      <div class="min-w-0">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h3
            class="text-base md:text-lg font-extrabold text-surface-900 dark:text-white tracking-tight truncate">
            {{ nutrientType.name }}
          </h3>
          <span
            class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-surface-100 dark:bg-surface-800/90 text-surface-700 dark:text-surface-300 border border-surface-200/80 dark:border-surface-700/80 shadow-2xs">
            {{ categoryGroups.length }}
            {{ categoryGroups.length === 1 ? 'Group' : 'Groups' }}
          </span>
        </div>
        @if (nutrientType.description) {
          <p class="text-xs text-surface-500 dark:text-surface-400 font-medium truncate mt-1">
            {{ nutrientType.description }}
          </p>
        }
      </div>
    </div>

    <!-- Right Stats & Expand Icon -->
    <div class="flex items-center gap-3 shrink-0">
      <!-- Stock badges -->
      <div class="hidden sm:flex items-center gap-2 text-xs">
        @if (totalIngredientsCount === 0) {
          <span
            class="px-3 py-1.5 rounded-xl font-bold bg-surface-100/80 dark:bg-surface-800/70 text-surface-500 dark:text-surface-400 border border-surface-200/70 dark:border-surface-700/70 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-surface-400"></span>
            0 In Stock
          </span>
        } @else {
          <span
            class="px-3 py-1.5 rounded-xl font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5 shadow-2xs">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            {{ inStockIngredientsCount }}/{{ totalIngredientsCount }} In Stock
          </span>
          <span
            class="px-3 py-1.5 rounded-xl font-bold bg-surface-100/80 dark:bg-surface-800/70 text-surface-700 dark:text-surface-300 border border-surface-200/70 dark:border-surface-700/70">
            {{ totalItemsCount }} {{ totalItemsCount === 1 ? 'item' : 'items' }}
          </span>
        }
      </div>

      <!-- Chevron Toggle -->
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center bg-surface-100/80 dark:bg-surface-800/80 hover:bg-surface-200/60 dark:hover:bg-surface-700 text-surface-600 dark:text-surface-300 border border-surface-200/80 dark:border-surface-700/80 transition-all duration-300 shadow-2xs"
        [class.rotate-180]="isExpanded">
        <i class="pi pi-chevron-down text-xs font-bold"></i>
      </div>
    </div>
  </button>

  <!-- Nested Categories Accordion Body -->
  @if (isExpanded) {
    <div
      class="p-4 md:p-5 space-y-4 border-t border-surface-200/60 dark:border-surface-800/60 bg-surface-50/50 dark:bg-surface-900/30 backdrop-blur-xs">
      @for (group of categoryGroups; track getGroupCategoryId(group)) {
        <pantry-ingredient-group
          [group]="group"
          [isExpanded]="isCategoryExpanded(getGroupCategoryId(group))"
          [expandedIngredients]="expandedIngredients"
          (toggle)="onToggleCategory($event)"
          (toggleIngredient)="onToggleIngredient($event)"
          (unassignItem)="unassignItem.emit($event)">
        </pantry-ingredient-group>
      }
    </div>
  }
</div>
