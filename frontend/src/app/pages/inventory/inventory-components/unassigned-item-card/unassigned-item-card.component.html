<div class="flex flex-col gap-2.5 p-3.5 bg-white dark:bg-surface-900/90 rounded-xl border border-surface-200/80 dark:border-surface-800/80 shadow-xs hover:border-amber-500/40 transition-all duration-200 group">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0 text-xs">
        📦
      </div>
      <div class="min-w-0">
        <p class="font-bold text-surface-900 dark:text-white text-xs truncate group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">
          {{ item.name }}
        </p>
        <p class="text-[11px] text-surface-500 dark:text-surface-400 font-medium">
          {{ item.quantity }} {{ item.unit.shortName }} • 📍 {{ item.location.name }}
        </p>
      </div>
    </div>
  </div>
  
  <p-select 
    [options]="categoryGroups" 
    [group]="true"
    optionGroupLabel="category.name"
    optionGroupChildren="ingredients"
    optionLabel="name"
    placeholder="Assign to ingredient..."
    (onChange)="onAssign($event.value)"
    styleClass="w-full !h-8 !text-xs !flex !items-center !bg-surface-50 dark:!bg-surface-800/60 !border-surface-200/80 dark:!border-surface-700/80 !rounded-lg font-semibold shadow-xs">
  </p-select>
</div>
