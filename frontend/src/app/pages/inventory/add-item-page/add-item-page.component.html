<ng-container *transloco="let t">
  <div class="page-layout page-layout--form">
    <header class="page-header">
      <div class="min-w-0">
        <button
          type="button"
          class="btn-ghost hover:!bg-transparent mb-2"
          (click)="onCancel()"
          [disabled]="isSubmitting()"
          [attr.aria-label]="t('itemEditor.back')">
          <i class="pi pi-arrow-left" aria-hidden="true"></i>
          <span>{{ t('nav.back') }}</span>
        </button>
        <h1 class="type-page-title text-surface-900 dark:text-white">
          {{ t('itemEditor.addTitle') }}
        </h1>
        <p class="text-sm text-surface-600 dark:text-surface-300 mt-2">
          {{ t('itemEditor.subtitle') }}
        </p>
      </div>
    </header>
    <pantry-item-editor
      [form]="addItemForm"
      [ingredients]="ingredients()"
      [units]="units()"
      [locations]="locations()"
      [submitting]="isSubmitting()"
      [error]="submitError()"
      [editing]="false"
      (save)="onSubmit()"
      (cancelEdit)="onCancel()"
      (createIngredient)="openQuickCreateIngredient()" />
  </div>
  <p-dialog
    [header]="t('itemEditor.createTitle')"
    [visible]="displayQuickCreateDialog()"
    (visibleChange)="displayQuickCreateDialog.set($event)"
    [modal]="true"
    [style]="{ width: '28rem', maxWidth: 'calc(100vw - 2rem)' }"
    [closable]="!isCreatingIngredient()"
    [closeOnEscape]="!isCreatingIngredient()"
    [draggable]="false"
    [resizable]="false"
    appendTo="body">
    <p class="text-sm text-surface-600 dark:text-surface-300 mb-5">
      {{ t('itemEditor.createHint') }}
    </p>
    <fieldset
      [attr.inert]="isCreatingIngredient() ? '' : null"
      [disabled]="isCreatingIngredient()"
      class="min-w-0 space-y-4">
      <pantry-form-field
        forId="new-ingredient-name"
        [label]="t('itemEditor.ingredientName')"
        [required]="true">
        <input
          pInputText
          id="new-ingredient-name"
          [ngModel]="newIngredientName()"
          (ngModelChange)="newIngredientName.set($event)"
          [placeholder]="t('itemEditor.ingredientNamePlaceholder')"
          class="w-full" />
      </pantry-form-field>
      <pantry-form-field
        #unitField
        forId="new-ingredient-unit"
        [label]="t('itemEditor.defaultUnit')"
        [required]="true">
        <p-select
          [disabled]="isCreatingIngredient()"
          inputId="new-ingredient-unit"
          [ariaLabelledBy]="unitField.labelId()"
          [options]="units()"
          [ngModel]="newIngredientDefaultUnit()"
          (ngModelChange)="newIngredientDefaultUnit.set($event)"
          optionLabel="name"
          [filter]="true"
          [placeholder]="t('itemEditor.unitPlaceholder')"
          class="w-full"
          appendTo="body" />
      </pantry-form-field>
      <pantry-form-field #groupField forId="new-ingredient-group" [label]="t('itemEditor.group')">
        <p-select
          [disabled]="isCreatingIngredient()"
          inputId="new-ingredient-group"
          [ariaLabelledBy]="groupField.labelId()"
          [options]="ingredientGroups()"
          [ngModel]="newIngredientGroup()"
          (ngModelChange)="newIngredientGroup.set($event)"
          optionLabel="name"
          [filter]="true"
          [showClear]="true"
          [placeholder]="t('itemEditor.groupPlaceholder')"
          class="w-full"
          appendTo="body" />
      </pantry-form-field>
    </fieldset>
    @if (quickCreateError()) {
      <pantry-alert variant="danger" class="block mt-4">{{ quickCreateError() }}</pantry-alert>
    }
    <ng-template pTemplate="footer">
      <button
        type="button"
        class="btn-secondary"
        [disabled]="isCreatingIngredient()"
        (click)="displayQuickCreateDialog.set(false)">
        {{ t('itemEditor.cancel') }}
      </button>
      <button
        type="button"
        class="btn-primary"
        [disabled]="
          isCreatingIngredient() || !newIngredientName().trim() || !newIngredientDefaultUnit()
        "
        (click)="submitQuickCreateIngredient()">
        @if (isCreatingIngredient()) {
          <pantry-spinner [announce]="false" size="sm" color="white" />
        }
        {{ t(isCreatingIngredient() ? 'itemEditor.creating' : 'itemEditor.create') }}
      </button>
    </ng-template>
  </p-dialog>
</ng-container>
