<div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
  <!-- Page Header -->
  <div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-3">
      <button (click)="onCancel()" type="button" class="btn-icon" aria-label="Back" title="Back">
        <i class="pi pi-arrow-left text-base"></i>
      </button>
      <div>
        <h2 class="text-3xl font-extrabold tracking-tight text-surface-900 dark:text-white">
          Edit Ingredient
        </h2>
        <p class="text-surface-500 dark:text-surface-400 mt-1.5 text-sm">
          Update ingredient properties, taxonomy group, or default unit.
        </p>
      </div>
    </div>
  </div>

  @if (isLoading()) {
    <div
      class="glass-card rounded-2xl border border-surface-200/60 dark:border-surface-800/80 p-8 flex items-center justify-center">
      <pantry-spinner size="lg" label="Loading ingredient details..."></pantry-spinner>
    </div>
  } @else {
    @if (submitError()) {
      <div
        class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 text-sm font-medium flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5 shrink-0">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        <span>{{ submitError() }}</span>
      </div>
    }

    <!-- Form Card -->
    <div class="glass-card rounded-2xl p-6 shadow-xl space-y-6">
      <form [formGroup]="ingredientForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Name Field -->
        <pantry-form-field
          [label]="'Ingredient Name'"
          forId="edit-ingredient-name"
          [required]="true"
          [error]="
            ingredientForm.get('name')?.invalid && ingredientForm.get('name')?.touched
              ? 'Ingredient name is required (min 2 characters).'
              : ''
          ">
          <input
            pInputText
            type="text"
            id="edit-ingredient-name"
            formControlName="name"
            placeholder="e.g. Spaghetti, Fuji Apples, Chicken Breast"
            class="w-full !p-3 !rounded-xl !bg-white/80 dark:!bg-surface-900/80 !border-surface-200 dark:!border-surface-700 !text-surface-900 dark:!text-white" />
        </pantry-form-field>

        <!-- Ingredient Group Select -->
        <pantry-form-field
          [label]="'Ingredient Group (Taxonomy Category)'"
          forId="edit-ingredient-group">
          <p-select
            inputId="edit-ingredient-group"
            [options]="ingredientGroups()"
            formControlName="ingredientGroup"
            optionLabel="name"
            placeholder="Select Ingredient Group (e.g. Pasta, Bakery, Grains)"
            [filter]="true"
            filterBy="name"
            filterPlaceholder="Search ingredient groups..."
            [showClear]="true"
            class="w-full"
            appendTo="body">
          </p-select>
        </pantry-form-field>

        <!-- Default Unit Select -->
        <pantry-form-field
          [label]="'Default Measurement Unit'"
          forId="edit-default-unit"
          [required]="true"
          [error]="
            ingredientForm.get('defaultUnit')?.invalid && ingredientForm.get('defaultUnit')?.touched
              ? 'Default measurement unit is required.'
              : ''
          ">
          <p-select
            inputId="edit-default-unit"
            [options]="units()"
            formControlName="defaultUnit"
            optionLabel="name"
            placeholder="Select Default Unit (e.g. Grams, Pieces, Liters)"
            [filter]="true"
            filterBy="name"
            filterPlaceholder="Search units..."
            [showClear]="true"
            class="w-full"
            appendTo="body">
          </p-select>
        </pantry-form-field>

        <!-- Action Buttons -->
        <div
          class="flex items-center justify-end gap-3 pt-4 border-t border-surface-200/40 dark:border-surface-800/40">
          <button type="button" (click)="onCancel()" class="btn-secondary">Cancel</button>
          <button type="submit" [disabled]="isSubmitting()" class="btn-primary">
            @if (isSubmitting()) {
              <pantry-spinner size="sm" color="white" />
            }
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  }
</div>
