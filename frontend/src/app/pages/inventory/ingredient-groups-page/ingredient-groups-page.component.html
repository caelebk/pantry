<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- Top Bar & Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-surface-900 dark:text-white">
        Nutrient & Ingredient Groups
      </h1>
      <p class="text-sm text-surface-500 dark:text-surface-400">
        4-Tier Domain Hierarchy Explorer: Nutrient Pillars → Ingredient Groups → Master Ingredients → Stock Items.
      </p>
    </div>
    <div>
      <button
        (click)="onAddGroup()"
        class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold shadow-lg shadow-primary-500/25 transition-all cursor-pointer text-sm flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Add Ingredient Group</span>
      </button>
    </div>
  </div>

  @if (isLoading()) {
    <div class="glass-card rounded-2xl border border-surface-200/60 dark:border-surface-800/80 p-8 flex items-center justify-center">
      <div class="flex items-center gap-3 text-surface-500">
        <svg class="animate-spin h-5 w-5 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-medium">Loading taxonomy tree...</span>
      </div>
    </div>
  } @else {
    <!-- Full Interactive Ingredient Group Container -->
    <pantry-ingredient-group-container
      [nutrientGroups]="nutrientGroups()"
      [categories]="categories()"
      [searchQuery]="searchQuery()"
      [selectedCategory]="selectedCategory()"
      (searchChange)="searchQuery.set($event)"
      (categorySelect)="selectedCategory.set($event)"
      (unassignItem)="onUnassignItem($event)">
    </pantry-ingredient-group-container>
  }
</div>
