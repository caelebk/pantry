<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- Page Title & Header Actions -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h2 class="text-3xl font-extrabold tracking-tight text-surface-900 dark:text-white">
        Nutrient & Ingredient Groups
      </h2>
      <p class="text-surface-500 dark:text-surface-400 mt-1.5 text-sm">
        4-Tier Domain Hierarchy Explorer: Nutrient Pillars → Ingredient Groups → Ingredients → Stock
        Items.
      </p>
    </div>
    <div class="flex items-center gap-3">
      <button
        (click)="onAddGroup()"
        class="px-5 py-3 cursor-pointer inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white font-bold text-sm rounded-xl shadow-md shadow-primary-600/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
        <i class="pi pi-plus text-base font-bold"></i>
        <span>Add Ingredient Group</span>
      </button>
    </div>
  </div>

  @if (isLoading()) {
    <div
      class="glass-card rounded-2xl border border-surface-200/60 dark:border-surface-800/80 p-8 flex items-center justify-center">
      <div class="flex items-center gap-3 text-surface-500">
        <svg
          class="animate-spin h-5 w-5 text-primary-500"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-medium">Loading taxonomy tree...</span>
      </div>
    </div>
  } @else {
    <!-- Full Interactive Ingredient Group Container -->
    <pantry-ingredient-group-container
      [nutrientGroups]="nutrientGroups()"
      [categories]="categories()"
      [searchQuery]="searchQuery()"
      [selectedCategory]="selectedCategory()"
      (searchChange)="searchQuery.set($event)"
      (categorySelect)="selectedCategory.set($event)"
      (unassignItem)="onUnassignItem($event)">
    </pantry-ingredient-group-container>
  }
</div>
