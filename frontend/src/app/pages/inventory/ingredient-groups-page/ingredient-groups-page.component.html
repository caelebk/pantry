<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- Page Title & Header Actions -->
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-8">
    <div class="space-y-2">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-2xl bg-primary-500/10 text-primary-500 flex items-center justify-center text-xl font-bold border border-primary-500/20 shadow-xs">
          🧬
        </div>
        <h2 class="text-3xl font-extrabold tracking-tight text-surface-900 dark:text-white">
          Ingredient Categories & Groups
        </h2>
      </div>

      <!-- Visual 4-Tier Hierarchy Breadcrumbs -->
      <div class="flex flex-wrap items-center gap-2 pt-1">
        <span class="text-xs font-semibold text-surface-500 dark:text-surface-400 mr-1">
          Hierarchy:
        </span>
        <span
          class="px-2.5 py-1 rounded-xl text-xs font-bold bg-primary-500/10 text-primary-600 dark:text-primary-400 border border-primary-500/20 flex items-center gap-1.5 shadow-2xs">
          <span>🧬</span>
          <span>Category</span>
        </span>
        <span class="text-surface-400 text-xs font-bold">→</span>
        <span
          class="px-2.5 py-1 rounded-xl text-xs font-bold bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20 flex items-center gap-1.5 shadow-2xs">
          <span>🏷️</span>
          <span>Group</span>
        </span>
        <span class="text-surface-400 text-xs font-bold">→</span>
        <span
          class="px-2.5 py-1 rounded-xl text-xs font-bold bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 flex items-center gap-1.5 shadow-2xs">
          <span>🍎</span>
          <span>Ingredient</span>
        </span>
        <span class="text-surface-400 text-xs font-bold">→</span>
        <span
          class="px-2.5 py-1 rounded-xl text-xs font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5 shadow-2xs">
          <span>📦</span>
          <span>Physical Item</span>
        </span>
      </div>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <button
        (click)="onAddGroup()"
        class="px-5 py-3 cursor-pointer inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white font-bold text-sm rounded-xl shadow-md shadow-primary-600/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
        <i class="pi pi-plus text-base font-bold"></i>
        <span>Add Ingredient Group</span>
      </button>
    </div>
  </div>

  @if (isLoading()) {
    <div
      class="glass-card rounded-2xl border border-surface-200/60 dark:border-surface-800/80 p-8 flex items-center justify-center">
      <div class="flex items-center gap-3 text-surface-500">
        <svg
          class="animate-spin h-5 w-5 text-primary-500"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-medium">Loading taxonomy tree...</span>
      </div>
    </div>
  } @else {
    <!-- Full Interactive Ingredient Group Container -->
    <pantry-ingredient-group-container
      [nutrientGroups]="nutrientGroups()"
      [categories]="categories()"
      [searchQuery]="searchQuery()"
      [selectedCategory]="selectedCategory()"
      (searchChange)="searchQuery.set($event)"
      (categorySelect)="selectedCategory.set($event)"
      (unassignItem)="onUnassignItem($event)">
    </pantry-ingredient-group-container>
  }
</div>
