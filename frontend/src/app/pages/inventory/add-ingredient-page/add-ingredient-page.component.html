<div class="page-layout page-layout--form">
  <header class="page-header">
    <div>
      <button (click)="onCancel()" type="button" class="btn-ghost hover:!bg-transparent mb-2">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span>{{ 'nav.back' | transloco }}</span>
      </button>
      <h1 class="type-page-title text-surface-900 dark:text-white">
        {{ 'ingredientForm.addTitle' | transloco }}
      </h1>
    </div>
  </header>
  @if (submitError()) {
    <pantry-alert variant="danger">{{ submitError() }}</pantry-alert>
  }

  <!-- Form Card -->
  <pantry-card padding="md">
    <form [formGroup]="ingredientForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Name Field -->
      <pantry-form-field
        [label]="'ingredientForm.name' | transloco"
        forId="add-ingredient-name"
        [required]="true"
        [error]="
          ingredientForm.get('name')?.invalid && ingredientForm.get('name')?.touched
            ? ('ingredientForm.nameError' | transloco)
            : ''
        ">
        <input
          pInputText
          type="text"
          id="add-ingredient-name"
          formControlName="name"
          [placeholder]="'ingredientForm.namePlaceholder' | transloco"
          class="w-full" />
      </pantry-form-field>

      <!-- Ingredient Group Select -->
      <pantry-form-field
        [label]="'ingredientForm.group' | transloco"
        #groupField
        forId="add-ingredient-group"
        [hint]="'ingredientForm.groupHint' | transloco">
        <p-select
          inputId="add-ingredient-group"
          [ariaLabelledBy]="groupField.labelId()"
          [options]="ingredientGroups()"
          formControlName="ingredientGroup"
          optionLabel="name"
          [placeholder]="'ingredientForm.groupPlaceholder' | transloco"
          [filter]="true"
          filterBy="name"
          [filterPlaceholder]="'ingredientForm.groupFilterPlaceholder' | transloco"
          [showClear]="true"
          class="w-full"
          appendTo="body">
        </p-select>
      </pantry-form-field>

      <!-- Default Unit Select -->
      <pantry-form-field
        [label]="'ingredientForm.unit' | transloco"
        #unitField
        forId="add-default-unit"
        [required]="true"
        [error]="
          ingredientForm.get('defaultUnit')?.invalid && ingredientForm.get('defaultUnit')?.touched
            ? ('ingredientForm.unitError' | transloco)
            : ''
        ">
        <p-select
          inputId="add-default-unit"
          [ariaLabelledBy]="unitField.labelId()"
          [options]="units()"
          formControlName="defaultUnit"
          optionLabel="name"
          [placeholder]="'ingredientForm.unitPlaceholder' | transloco"
          [filter]="true"
          filterBy="name"
          [filterPlaceholder]="'ingredientForm.unitFilterPlaceholder' | transloco"
          [showClear]="true"
          class="w-full"
          appendTo="body">
        </p-select>
      </pantry-form-field>

      <!-- Action Buttons -->
      <div
        class="flex items-center justify-end gap-3 pt-4 border-t border-surface-200/40 dark:border-surface-800/40">
        <button type="button" (click)="onCancel()" class="btn-secondary">
          {{ 'ingredientForm.cancel' | transloco }}
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          [attr.aria-busy]="isSubmitting()"
          class="btn-primary">
          @if (isSubmitting()) {
            <pantry-spinner [announce]="false" size="sm" color="white" />
          }
          <span>{{ 'ingredientForm.save' | transloco }}</span>
        </button>
      </div>
    </form>
  </pantry-card>
</div>
