<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
  <!-- Page Header & Action Bar -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-surface-900 dark:text-white tracking-tight">
        Weekly Meal Planner
      </h1>
      <p class="text-sm font-medium text-surface-500 dark:text-surface-400 mt-1">
        Schedule recipe meals, track ingredient availability, and auto-sync to shopping list
      </p>
    </div>

    <!-- Quick Actions Group -->
    <div class="flex flex-wrap items-center gap-2.5 shrink-0 self-start md:self-auto">
      @if (missingItemsCount() > 0) {
        <button
          (click)="syncAllMissingToShoppingList()"
          class="inline-flex items-center gap-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-700 dark:text-rose-300 border border-rose-500/20 dark:border-rose-500/30 text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-xs hover:scale-[1.01] active:scale-[0.99] transition-all cursor-pointer">
          🛒 Sync {{ missingItemsCount() }} Missing Item{{ missingItemsCount() > 1 ? 's' : '' }}
        </button>
      }

      <button
        (click)="openAddModal()"
        class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-md shadow-primary-600/20 hover:scale-[1.01] active:scale-[0.99] transition-all cursor-pointer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Plan a Meal</span>
      </button>
    </div>
  </div>

  <!-- Sub-Page Navigation Tabs -->
  <div
    class="flex items-center justify-between border-b border-surface-200/80 dark:border-surface-800/80 pb-3 panel-reveal panel-delay-1">
    <div
      class="flex items-center gap-1 bg-surface-100 dark:bg-surface-800/60 p-1 rounded-xl border border-surface-200/80 dark:border-surface-800/80">
      <button
        (click)="setSubTab('calendar')"
        [class]="
          activeSubTab() === 'calendar'
            ? 'px-4 py-2 font-bold rounded-lg bg-white dark:bg-surface-700 text-primary-600 dark:text-primary-400 shadow-xs transition-all text-xs flex items-center gap-2 cursor-pointer'
            : 'px-4 py-2 font-medium rounded-lg text-surface-600 dark:text-surface-400 hover:text-surface-900 dark:hover:text-white transition-all text-xs flex items-center gap-2 cursor-pointer'
        ">
        <span>📅</span> Weekly Calendar
      </button>

      <button
        (click)="setSubTab('daily')"
        [class]="
          activeSubTab() === 'daily'
            ? 'px-4 py-2 font-bold rounded-lg bg-white dark:bg-surface-700 text-primary-600 dark:text-primary-400 shadow-xs transition-all text-xs flex items-center gap-2 cursor-pointer'
            : 'px-4 py-2 font-medium rounded-lg text-surface-600 dark:text-surface-400 hover:text-surface-900 dark:hover:text-white transition-all text-xs flex items-center gap-2 cursor-pointer'
        ">
        <span>🎯</span> Daily Focus
      </button>
    </div>
  </div>

  <!-- Dynamic Views -->
  <div class="panel-reveal panel-delay-2">
    @if (mealPlannerService.isLoading()) {
      <div class="glass-card rounded-2xl h-96 animate-pulse" aria-busy="true"></div>
    } @else if (activeSubTab() === 'calendar') {
      <pantry-weekly-view [meals]="plannedMeals()" (addMealRequested)="openAddModal($event)">
      </pantry-weekly-view>
    } @else if (activeSubTab() === 'daily') {
      <pantry-daily-focus [meals]="plannedMeals()" (addMealRequested)="openAddModal($event)">
      </pantry-daily-focus>
    }
  </div>
</div>
