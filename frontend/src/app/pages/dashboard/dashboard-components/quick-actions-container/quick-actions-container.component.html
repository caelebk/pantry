<div class="glass-card rounded-2xl p-6 transition-all duration-300 hover:shadow-lg">
  <h3 class="type-section-title text-surface-900 dark:text-white mb-5">
    {{ 'dashboard.quickActions.title' | transloco }}
  </h3>
  <div class="space-y-3">
    <button (click)="onAddItem()" class="btn-primary w-full hover:scale-[1.02]">
      {{ 'dashboard.quickActions.addItem' | transloco }}
    </button>
    <button
      (click)="onAddRecipe()"
      class="btn-secondary w-full hover:scale-[1.01] active:scale-[0.99]">
      {{ 'dashboard.quickActions.addRecipe' | transloco }}
    </button>
  </div>
</div>
