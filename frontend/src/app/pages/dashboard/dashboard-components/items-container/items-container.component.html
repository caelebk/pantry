<div
  class="glass-card rounded-2xl overflow-hidden transition-all duration-300 hover:shadow-lg"
  [ngClass]="{
    'hover:shadow-red-500/5': theme() === 'red',
    'hover:shadow-amber-500/5': theme() === 'amber',
    'hover:shadow-primary-500/5': theme() === 'orange',
    'hover:shadow-surface-500/5': theme() === 'gray',
  }">
  <!-- Header bar with accent color -->
  <div
    class="h-1"
    [ngClass]="{
      'bg-gradient-to-r from-red-500 to-red-400': theme() === 'red',
      'bg-gradient-to-r from-amber-500 to-amber-400': theme() === 'amber',
      'bg-gradient-to-r from-primary-500 to-primary-400': theme() === 'orange',
      'bg-gradient-to-r from-surface-400 to-surface-300': theme() === 'gray',
    }"></div>

  <div class="p-6">
    <div class="flex justify-between items-center mb-5">
      <h3 class="text-base font-bold text-surface-900 dark:text-white tracking-tight">
        {{ titleKey() | transloco }}
      </h3>
      <span
        class="text-xs font-bold px-2.5 py-1 rounded-full"
        [ngClass]="{
          'bg-red-100 dark:bg-red-900/20 text-red-700 dark:text-red-400': theme() === Theme.Red,
          'bg-primary-100 dark:bg-primary-900/20 text-primary-700 dark:text-primary-400':
            theme() === Theme.Orange,
          'bg-surface-200 dark:bg-surface-700 text-surface-600 dark:text-surface-300':
            theme() === Theme.Gray,
          'bg-amber-100 dark:bg-amber-900/20 text-amber-700 dark:text-amber-400':
            theme() === Theme.Amber,
        }">
        {{ items().length }}
      </span>
    </div>

    <div #itemsList class="space-y-2.5 items-list" [class.isExpanded]="isExpanded()">
      @for (item of visibleItems(); track item.name; let i = $index) {
        <div
          [@staggeredFadeIn]="{ value: '', params: { delay: i * staggerDelayPerItemMs } }"
          class="bg-white/50 dark:bg-surface-800/50 p-4 rounded-xl flex justify-between items-center transition-all duration-200 hover:bg-white/80 dark:hover:bg-surface-800/80 group/item">
          <div class="min-w-0 flex-1">
            <h4
              class="font-semibold text-sm text-surface-900 dark:text-white truncate"
              [ngClass]="{
                'line-through decoration-surface-400 dark:decoration-surface-500 opacity-60':
                  theme() === Theme.Red,
              }">
              {{ item.name }}
            </h4>
            <p class="text-xs text-surface-400 dark:text-surface-500 mt-0.5 truncate">
              {{ item.location.name }}
            </p>
          </div>
          <div class="text-right shrink-0 ml-4">
            @let timeDiff = getItemTimeDifference(item);
            <span
              class="text-xs font-bold px-2 py-0.5 rounded-md inline-block"
              [ngClass]="{
                'text-red-700 dark:text-red-400 bg-red-100/80 dark:bg-red-900/20':
                  timeDiff.isExpired,
                'text-amber-700 dark:text-amber-400 bg-amber-100/80 dark:bg-amber-900/20':
                  !timeDiff.isExpired && timeDiff.isClose,
                'text-primary-700 dark:text-primary-400 bg-primary-100/80 dark:bg-primary-900/20':
                  !timeDiff.isExpired && !timeDiff.isClose,
              }">
              {{ timeDiff.label }}
            </span>
            <p class="text-xs text-surface-400 dark:text-surface-500 mt-1">
              {{ item.quantity }} {{ item.unit.name }}
            </p>
          </div>
        </div>
      }
    </div>

    @if (showToggle()) {
      <div class="mt-4 text-center">
        <button
          (click)="toggleExpand()"
          class="text-sm text-surface-400 dark:text-surface-500 hover:text-primary-600 dark:hover:text-primary-400 font-medium focus:outline-none cursor-pointer transition-all duration-200 hover:tracking-wide">
          @if (isExpanded()) {
            {{ 'common.showLess' | transloco }}
          } @else {
            +{{ hiddenItemsCount() }}
            {{
              (hiddenItemsCount() === 1 ? footerMessageKey() + '_one' : footerMessageKey())
                | transloco
            }}
          }
        </button>
      </div>
    }
  </div>
</div>
