<div class="glass-card rounded-2xl p-6 transition-all duration-300 hover:shadow-lg">
  <div class="flex items-center justify-between mb-4">
    <h3
      class="text-base font-bold text-surface-900 dark:text-white tracking-tight flex items-center gap-2">
      <i class="pi pi-bolt text-primary-600 dark:text-primary-400"></i>
      {{ 'home.shortcuts.title' | transloco }}
    </h3>
  </div>

  <div class="space-y-2.5">
    <!-- Primary CTA: Add Item -->
    <button (click)="onAddItem()" class="btn-primary w-full justify-between">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-plus text-xs"></i>
        <span>{{ 'home.shortcuts.addItem' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs opacity-75 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Create Recipe -->
    <button (click)="onAddRecipe()" class="btn-secondary w-full justify-between">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-book text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.addRecipe' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Assign Ingredients -->
    <button (click)="onAssignIngredients()" class="btn-secondary w-full justify-between">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-sitemap text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.assignIngredients' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Browse Inventory -->
    <button (click)="onBrowseInventory()" class="btn-secondary w-full justify-between">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-box text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.manageInventory' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>
  </div>
</div>
