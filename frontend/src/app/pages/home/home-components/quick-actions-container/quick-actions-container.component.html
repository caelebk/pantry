<div class="glass-card rounded-2xl p-6 transition-all duration-300 hover:shadow-lg">
  <div class="flex items-center justify-between mb-4">
    <h3
      class="text-base font-bold text-surface-900 dark:text-white tracking-tight flex items-center gap-2">
      <i class="pi pi-bolt text-primary-600 dark:text-primary-400"></i>
      {{ 'home.shortcuts.title' | transloco }}
    </h3>
  </div>

  <div class="space-y-2.5">
    <!-- Primary CTA: Add Item -->
    <button
      (click)="onAddItem()"
      class="w-full cursor-pointer p-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold text-sm transition-all duration-200 shadow-sm hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between group">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-plus text-xs"></i>
        <span>{{ 'home.shortcuts.addItem' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs opacity-75 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Create Recipe -->
    <button
      (click)="onAddRecipe()"
      class="w-full cursor-pointer p-3 bg-white/60 dark:bg-surface-800/60 text-surface-800 dark:text-surface-100 rounded-xl font-semibold text-sm border border-surface-200/80 dark:border-surface-700/80 hover:bg-white dark:hover:bg-surface-800 transition-all duration-200 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between group">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-book text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.addRecipe' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Assign Ingredients -->
    <button
      (click)="onAssignIngredients()"
      class="w-full cursor-pointer p-3 bg-white/60 dark:bg-surface-800/60 text-surface-800 dark:text-surface-100 rounded-xl font-semibold text-sm border border-surface-200/80 dark:border-surface-700/80 hover:bg-white dark:hover:bg-surface-800 transition-all duration-200 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between group">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-sitemap text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.assignIngredients' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>

    <!-- Browse Inventory -->
    <button
      (click)="onBrowseInventory()"
      class="w-full cursor-pointer p-3 bg-white/60 dark:bg-surface-800/60 text-surface-800 dark:text-surface-100 rounded-xl font-semibold text-sm border border-surface-200/80 dark:border-surface-700/80 hover:bg-white dark:hover:bg-surface-800 transition-all duration-200 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between group">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-box text-xs text-surface-500"></i>
        <span>{{ 'home.shortcuts.manageInventory' | transloco }}</span>
      </div>
      <i
        class="pi pi-chevron-right text-xs text-surface-400 group-hover:translate-x-0.5 transition-transform"></i>
    </button>
  </div>
</div>
