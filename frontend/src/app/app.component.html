<div
  class="relative h-screen font-sans text-surface-900 dark:text-surface-100 transition-colors duration-300 overflow-hidden animated-gradient-bg">
  <!-- Interactive Canvas Particle Web Background Layer -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <!-- Warm Ambient Mesh Gradient Orbs -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>

    <!-- HTML5 Canvas Particle Web -->
    <canvas #particleCanvas class="absolute inset-0 w-full h-full pointer-events-auto"></canvas>
  </div>

  <!-- Main App Content Container Layer -->
  <div class="relative z-10 flex flex-col md:flex-row h-full">
    <pantry-sidebar
      [darkMode]="darkMode()"
      (themeToggled)="toggleTheme()"
      [activeTab]="currentTab()"
      (tabSelected)="onTabSelected($event)"></pantry-sidebar>

    <div class="flex-1 min-w-0 flex flex-col overflow-y-auto">
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <pantry-breadcrumbs></pantry-breadcrumbs>
        <router-outlet></router-outlet>
      </main>
    </div>

    <pantry-toast-container></pantry-toast-container>
  </div>
</div>
