<div
  [@.disabled]="reducedMotion()"
  class="relative h-dvh font-sans text-surface-900 dark:text-surface-100 overflow-hidden shell-atmosphere">
  <!-- Auth Layout Split: Full-screen Auth Pages vs Main App Shell -->
  @if (isAuthRoute()) {
    <div class="relative z-10 h-full w-full overflow-y-auto">
      <router-outlet></router-outlet>
      <pantry-toast-container></pantry-toast-container>
    </div>
  } @else {
    <a
      href="#main"
      (click)="$event.preventDefault(); main.focus()"
      class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] focus:rounded-lg focus:bg-primary-700 focus:px-4 focus:py-2 focus:text-white focus:shadow-xl type-label">
      {{ 'a11y.skipToContent' | transloco }}
    </a>
    <div class="relative z-10 flex flex-col md:flex-row h-full">
      <pantry-sidebar
        [darkMode]="darkMode()"
        (themeToggled)="toggleTheme()"
        (logoutClicked)="handleLogout()"
        [activeTab]="currentTab()"
        (tabSelected)="onTabSelected($event)"
        (mobileMenuChanged)="mobileNavigationOpen.set($event)"></pantry-sidebar>

      <div
        class="flex-1 min-w-0 flex flex-col overflow-y-auto"
        [attr.inert]="mobileNavigationOpen() ? '' : null">
        <main
          #main
          id="main"
          tabindex="-1"
          class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 focus:outline-none">
          <pantry-breadcrumbs></pantry-breadcrumbs>
          <div [@routeTransition]="prepareRoute(outlet)" class="w-full">
            <router-outlet #outlet="outlet"></router-outlet>
          </div>
        </main>
      </div>

      <pantry-toast-container></pantry-toast-container>
      <pantry-confirm-dialog />
    </div>
  }
</div>
