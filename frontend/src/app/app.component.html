<div
  class="relative min-h-screen font-sans text-surface-900 dark:text-surface-100 transition-colors duration-300 overflow-x-hidden animated-gradient-bg">
  <!-- Kitchen-Themed Ambient Backdrop Layer -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <!-- Warm Ambient Mesh Gradient Orbs -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>

    <!-- Culinary SVG Grain & Utensil Pattern Overlay -->
    <div class="culinary-pattern-overlay"></div>

    <!-- Subtle Culinary Glass Floaters -->
    <div class="culinary-floater floater-1">
      <i class="pi pi-sparkles text-amber-600/35 dark:text-amber-400/25 text-xl"></i>
    </div>
    <div class="culinary-floater floater-2">
      <i class="pi pi-heart-fill text-primary-500/30 dark:text-primary-400/20 text-2xl"></i>
    </div>
    <div class="culinary-floater floater-3">
      <i class="pi pi-sun text-amber-700/30 dark:text-amber-300/20 text-xl"></i>
    </div>
  </div>

  <!-- Main App Content Container Layer -->
  <div class="relative z-10 flex flex-col md:flex-row min-h-screen">
    <pantry-sidebar
      [darkMode]="darkMode()"
      (themeToggled)="toggleTheme()"
      [activeTab]="currentTab()"
      (tabSelected)="onTabSelected($event)"></pantry-sidebar>

    <div class="flex-1 min-w-0 flex flex-col min-h-screen">
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <pantry-breadcrumbs></pantry-breadcrumbs>
        <router-outlet></router-outlet>
      </main>
    </div>

    <pantry-toast-container></pantry-toast-container>
  </div>
</div>
