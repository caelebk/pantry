services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantry_backend
    volumes:
      - pantry_db_data:/app/data
    # NOTE: the backend reads `ENVIRONMENT` (not DENO_ENV) — see backend/src/config/env.ts.
    # In production it hard-fails unless JWT_SECRET is set to a unique 32+ char value,
    # so provide it when deploying, e.g.:  JWT_SECRET=... docker compose up
    environment:
      - ENVIRONMENT=production
      - DB_PATH=/app/data/pantry.db
      - PORT=8000
    # Inline shell script: checks if sqlite DB exists, runs migrations & seeds if missing, then starts the API
    command: >
      sh -c "
        if [ ! -f /app/data/pantry.db ]; then
          echo '📦 Initializing fresh database...'
          deno task db:migrate &&
          deno task db:seed
        else
          echo '🔄 Running pending database migrations...'
          deno task db:migrate
        fi &&
        deno task start
      "
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    container_name: pantry_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pantry_db_data:
