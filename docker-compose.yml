services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantry_backend
    volumes:
      - pantry_db_data:/app/data
    environment:
      - ENVIRONMENT=production
      - DB_PATH=/app/data/pantry.db
      - PORT=8000
      # Fails fast at startup if unset — see backend/src/config/env.ts.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or stack env vars}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_EXPIRES_IN_SECONDS=${JWT_EXPIRES_IN_SECONDS:-900}
    # Inline shell script: checks if sqlite DB exists, runs migrations & seeds if missing, then starts the API
    command: >
      sh -c "
        if [ ! -f /app/data/pantry.db ]; then
          echo '📦 Initializing fresh database...'
          deno task db:migrate &&
          deno task db:seed
        else
          echo '🔄 Running pending database migrations...'
          deno task db:migrate
        fi &&
        deno task start
      "
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    container_name: pantry_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pantry_db_data:
